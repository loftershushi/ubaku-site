<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Team 写真 試作</title>
<!-- 3人の写真を「日本の癒し系の写真家」風にやわらかく加工した試作（2026-10-17。仮公開だけ。決まったら消す）
     写真は tools/make_team_soft.py で作る（元・やさしめ・しっかり） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400&family=Jost:wght@300&display=swap">
<style>
  :root{--ink:#2B241C;--sub:#6B6457;--green:#29463D;--panel:#F4F4F2}
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:var(--ink);font-family:'Noto Sans JP',sans-serif;font-weight:300}
  header,main{max-width:1100px;margin:0 auto;padding:0 16px}
  header{padding-top:40px}
  h1{font-size:20px;font-weight:400;letter-spacing:.08em;margin:0 0 8px}
  header p{font-size:13px;color:var(--sub);line-height:1.9;margin:0 0 24px}
  .cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:12px}
  .cols h2{margin:0;font-size:14px;font-weight:400;letter-spacing:.08em}
  .cols h2 b{font-family:'Jost',sans-serif;font-weight:300;color:var(--green);margin-right:.5em}
  .cols p{margin:4px 0 0;font-size:12px;color:var(--sub);line-height:1.7}
  .row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:16px}
  .row img{display:block;width:100%;aspect-ratio:1;object-fit:cover;object-position:center 30%}
  @media (max-width:640px){.cols,.row{gap:6px}.cols p{display:none}}
</style>
</head>
<body>
<header>
  <h1>Team の写真：やわらかい加工の試作</h1>
  <p>左から「今の写真」「やさしめ」「しっかり」です。黒を少し浮かせて白っぽくし、コントラストと色をうすく、明るいところはほんのり暖かく、影はほんのり青緑にしています。うっすら光がにじむ感じと、フィルムのような細かい粒子も少し足しています。</p>
</header>
<main>
  <div class="cols">
    <div><h2><b>0</b>今の写真</h2><p>加工なし</p></div>
    <div><h2><b>1</b>やさしめ</h2><p>自然さを残したまま、空気をやわらかく</p></div>
    <div><h2><b>2</b>しっかり</h2><p>白っぽく淡い、フィルム写真のような印象</p></div>
  </div>
  <div class="row"><img src="img/mashu-orig.webp" alt="Mashu（今の写真）"><img src="img/mashu-soft.webp" alt="Mashu（やさしめ）"><img src="img/mashu-strong.webp" alt="Mashu（しっかり）"></div>
  <div class="row"><img src="img/yamato-orig.webp" alt="Yamato（今の写真）"><img src="img/yamato-soft.webp" alt="Yamato（やさしめ）"><img src="img/yamato-strong.webp" alt="Yamato（しっかり）"></div>
  <div class="row"><img src="img/yushin-orig.webp" alt="Yushin（今の写真）"><img src="img/yushin-soft.webp" alt="Yushin（やさしめ）"><img src="img/yushin-strong.webp" alt="Yushin（しっかり）"></div>
</main>
</body>
</html>
